name: Offline prototype checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  correctness:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Offline correctness checks (no API key or model calls)
        run: python -m unittest -v test_midpoint.py test_coding_probe.py test_verified_probe.py
      - name: Validate all synthetic fixture graders
        run: python midpoint.py verify-fixtures
      - name: Reproduce the frozen real-bug evidence offline
        run: python build_coding_report.py
